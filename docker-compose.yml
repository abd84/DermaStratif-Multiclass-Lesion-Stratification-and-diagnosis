version: '3.8'

services:
  dermastratif:
    build: .
    container_name: dermastratif-app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./Saved\ Models:/app/Saved\ Models:ro
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - VISION_API_KEY=${VISION_API_KEY}
      - HOST=0.0.0.0
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
